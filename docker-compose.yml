services:
  python-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      WHATSAPP_WEB_SERVER_URL: http://whatsapp-server:3000
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - internal

  whatsapp-server:
    build:
      context: ./whatsapp-web-server
      dockerfile: Dockerfile
    restart: unless-stopped
    shm_size: 256mb
    environment:
      PYTHON_API_URL: http://python-api:8000
      WHATSAPP_WEB_PORT: 3000
    volumes:
      - whatsapp_session:/app/.wwebjs_auth
      - whatsapp_cache:/app/.wwebjs_cache
    networks:
      - internal

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      python-api:
        condition: service_healthy
    networks:
      - internal

volumes:
  whatsapp_session:
  whatsapp_cache:

networks:
  internal:
    driver: bridge
