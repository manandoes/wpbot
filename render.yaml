# render.yaml — Render Blueprint for wpbot
#
# Deploy: Render Dashboard → New → Blueprint → pick this repo.
# Render reads this file and creates all three services + the database.
#
# Services:
#   wpbot-api        FastAPI backend (Python)
#   wpbot-whatsapp   whatsapp-web.js gateway (Node + headless Chrome)
#   wpbot-dashboard  React admin dashboard (static site)
#
# ⚠️  wpbot-whatsapp runs a full headless Chrome and needs a persistent disk
#     for its WhatsApp login session. Neither fits Render's free plan — see
#     RENDER.md for the details and the plan/cost breakdown.

databases:
  - name: wpbot-db
    databaseName: wpbot
    user: wpbot
    plan: free          # ⚠️ free Postgres is removed after 30 days — upgrade to `basic-256mb` for anything real
    # MUST match the services' region. `fromDatabase → connectionString` below
    # hands out the *internal* host, which only resolves inside one region —
    # omitting this defaults the database to Oregon and the API cannot reach it.
    region: singapore

services:
  # ───────────────────────────────────────────────────────────────────────
  # FastAPI backend
  # ───────────────────────────────────────────────────────────────────────
  - type: web
    name: wpbot-api
    runtime: python
    plan: free
    region: singapore              # closest region to India; must match across services
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      # Wired automatically from the database defined above
      - key: DATABASE_URL
        fromDatabase:
          name: wpbot-db
          property: connectionString

      # Render blueprints cannot build a URL from another service's hostname,
      # so set this once in the dashboard after the first deploy:
      #   https://wpbot-whatsapp.onrender.com
      - key: WHATSAPP_WEB_SERVER_URL
        sync: false

      # Shared secret guarding the WhatsApp gateway's write endpoints.
      # Must be identical on wpbot-api and wpbot-whatsapp.
      - key: GATEWAY_TOKEN
        generateValue: true

      # Comma-separated dashboard origin(s), e.g. https://wpbot-dashboard.onrender.com
      - key: ALLOWED_ORIGINS
        sync: false

      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SEND_MESSAGE_API_KEY
        generateValue: true

  # ───────────────────────────────────────────────────────────────────────
  # WhatsApp Web gateway (Node + headless Chrome)
  # ───────────────────────────────────────────────────────────────────────
  - type: web
    name: wpbot-whatsapp
    runtime: node
    plan: standard                 # 2 GB RAM. Chrome + WhatsApp Web OOMs on free/starter (512 MB).
    region: singapore
    rootDir: whatsapp-web-server
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /health

    # Persistent disk keeps the WhatsApp login across deploys and restarts.
    # Without it you re-scan the QR code every single time the service restarts.
    disk:
      name: wpbot-session
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_VERSION
        value: "20.11.1"

      # Chrome is downloaded at build time. It must land inside the project
      # directory, which is the only path that survives into the runtime
      # filesystem on Render's native Node runtime.
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/whatsapp-web-server/.cache/puppeteer

      # WhatsApp session lives on the persistent disk mounted above
      - key: WWEBJS_DATA_PATH
        value: /var/data

      # Set to https://wpbot-api.onrender.com after the first deploy
      - key: PYTHON_API_URL
        sync: false

      # Must match GATEWAY_TOKEN on wpbot-api
      - key: GATEWAY_TOKEN
        sync: false

  # ───────────────────────────────────────────────────────────────────────
  # React admin dashboard (static site — free, no spin-down)
  # ───────────────────────────────────────────────────────────────────────
  - type: web
    name: wpbot-dashboard
    runtime: static
    rootDir: dashboard
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Set to https://wpbot-api.onrender.com after the first deploy.
      # Baked in at build time — changing it requires a redeploy.
      - key: VITE_API_URL
        sync: false
    routes:
      # SPA fallback — replaces the `try_files` rule the old nginx config had
      - type: rewrite
        source: /*
        destination: /index.html
